      const path = root.querySelector('[id="f04-visible-repair-path"]');

      const pathLength = path.getTotalLength();
      path.style.strokeDasharray = `${pathLength}`;
      path.style.strokeDashoffset = `${pathLength}`;

      const timeSequence = [
        { t: 0.0, text: "16:45" },
        { t: 0.45, text: "17:" },
        { t: 1.05, text: "17:1" },
        { t: 1.28, text: "17:15" },
        { t: 2.25, text: "17:15 ✓" },
      ];

      const textAt = (time) => {
        for (let i = timeSequence.length - 1; i >= 0; i -= 1) {
          if (time >= timeSequence[i].t) return timeSequence[i].text;
        }
        return "16:45";
      };

      const editDriver = { t: 0 };
      const blinkDriver = { p: 0 };
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        camera,
        { opacity: 0, scale: 0.985 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power1.out" },
        0,
      );
      tl.fromTo(
        root.querySelector('[data-role="kicker"]'),
        { opacity: 0, y: -12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power1.out" },
        0.08,

      tl.fromTo(
        root.querySelector('[data-role="headline"]'),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power1.out" },
        0.22,

      tl.fromTo(
        wash,
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.65, ease: "power2.out" },
        1.15,

      tl.fromTo(
        magnifier,
        { opacity: 0, x: 36 },
        { opacity: 1, x: 0, duration: 0.72, ease: "power2.out" },
        2.05,

      tl.fromTo(
        focusLabel,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.52, ease: "power1.out" },
        2.52,

      tl.to(
        camera,
        { x: -72, y: -20, scale: 1.075, duration: 2.15, ease: "power2.inOut" },
        3.15,

      tl.fromTo(
        repairBoard,
        { opacity: 0, y: 34, scale: 0.985 },
        { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power2.out" },
        7.5,
      );
      tl.fromTo(
        editCard,
        { opacity: 0, x: -28 },
        { opacity: 1, x: 0, duration: 0.56, ease: "power1.out" },
        8.12,
      );
      tl.to(
        editDriver,
        {
          t: 2.25,
          duration: 2.25,
          ease: "none",
          onUpdate: () => {
            timeEl.textContent = textAt(editDriver.t);
          },
        },
        8.45,
      );
      tl.to(
        blinkDriver,
        {
          p: Math.PI * 2 * 6,
          duration: 3.8,
          ease: "none",
          onUpdate: () => {
            cursorEl.style.opacity = Math.sin(blinkDriver.p) > 0 ? "1" : "0";
          },
        },
        8.45,
      );
      tl.fromTo(
        receiptCard,
        { opacity: 0, x: 28 },
        { opacity: 1, x: 0, duration: 0.6, ease: "power1.out" },
        11.45,
      );
      tl.to(
        path,
        { strokeDashoffset: 0, duration: 0.78, ease: "power2.out" },
        12.35,
      );
      tl.fromTo(
        settled,
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" },

      tl.fromTo(

        { opacity: 1, duration: 0.65, ease: "power1.out" },
        17.0,
      );
      tl.fromTo(
        evidence,
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.72, ease: "power2.out" },
        17.18,
      );
      tl.set(
        [
          root.querySelector('[data-role="kicker"]'),
          root.querySelector('[data-role="headline"]'),
          camera,
          magnifier,
          focusLabel,
          repairBoard,
        ],
        { visibility: "hidden" },
        17.18,
      );
      tl.fromTo(
        root.querySelector('[data-delta="before"]'),
        { opacity: 0, x: 24 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power1.out" },
        18.3,
      );
      tl.fromTo(
        root.querySelector('[data-delta="after"]'),
        { opacity: 0, x: 24 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power1.out" },
        19.65,
      );
      tl.fromTo(
        root.querySelector('[data-delta="reason"]'),
        { opacity: 0, x: 24 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power1.out" },
        21.0,

        boundary,

        22.45,

      tl.to(
        root.querySelector('[data-role="delta-card"]'),
        { y: -4, duration: 1.2, ease: "power1.out" },
        23.35,
      );

      tl.pause(0);
      const playbackDriver = { time: 0 };
      const playback = gsap.timeline({ paused: true });
      playback.to(playbackDriver, {
        time: 25,
        duration: 11.627,
        ease: "none",
        onUpdate: () => tl.time(playbackDriver.time, false),
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["04-visible-repair"] = playback;
    })();
