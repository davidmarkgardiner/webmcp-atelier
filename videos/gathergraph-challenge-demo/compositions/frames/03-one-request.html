  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const frameRoot = document.querySelector(
        '[data-composition-id="03-one-request"]',
      );
      const camera = frameRoot.querySelector('[id="f03-one-request-camera"]');
      const browser = frameRoot.querySelector('[id="f03-one-request-browser"]');
      const prompt = frameRoot.querySelector('[id="f03-one-request-prompt"]');
      const promptText = frameRoot.querySelector(
        '[id="f03-one-request-prompt-text"]',
      );
      const promptCursor = frameRoot.querySelector(
        '[id="f03-one-request-prompt-cursor"]',
      );
      const submit = frameRoot.querySelector('[id="f03-one-request-submit"]');
      const providerEls = Array.from(
        frameRoot.querySelectorAll('[data-role="provider"]'),
      );
      const providerStates = Array.from(
        frameRoot.querySelectorAll('[data-role="provider-state"]'),
      );
      const fills = Array.from(
        frameRoot.querySelectorAll('[data-role="fill"]'),
      );
      const receiptRail = frameRoot.querySelector(
        '[id="f03-one-request-receipt-rail"]',
      );
      const passport = frameRoot.querySelector(
        '[id="f03-one-request-passport"]',
      );
      const receipts = Array.from(
        frameRoot.querySelectorAll('[data-role="receipt"]'),
      );
      const planLockup = frameRoot.querySelector(
        '[id="f03-one-request-plan-lockup"]',
      );
      const railPaths = Array.from(
        frameRoot.querySelectorAll('[data-role="rail-path"]'),
      );

      railPaths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        browser,
        { opacity: 0, scale: 0.985 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" },
        0,
      );
      tl.fromTo(
        prompt,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        0.45,
      );

      const promptSequence = [
        { t: 0, text: "" },
        { t: 0.3, text: "Acc" },
        { t: 0.58, text: "Accessible" },
        { t: 1.0, text: "Accessible dinner" },
        { t: 1.42, text: "Accessible dinner · 40" },
        { t: 1.82, text: "Accessible dinner · 40 people" },
        { t: 2.34, text: "Accessible dinner · 40 people · under" },
        { t: 2.82, text: "Accessible dinner · 40 people · under £1,800" },
      ];
      const promptDriver = { t: 0 };
      tl.to(
        promptDriver,
        {
          t: 3.4,
          duration: 3.4,
          ease: "none",
          onUpdate: () => {
            for (let i = promptSequence.length - 1; i >= 0; i -= 1) {
              if (promptDriver.t >= promptSequence[i].t) {
                promptText.textContent = promptSequence[i].text;
                break;
              }
            }
          },
        },
        1.25,
      );

      const blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 14,
          duration: 5.4,
          ease: "none",
          onUpdate: () => {
            promptCursor.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        0.6,
      );

      tl.fromTo(
        submit,
        { scale: 1 },
        { scale: 0.94, duration: 0.14, ease: "power1.in" },
        5.6,
      );
      tl.to(submit, { scale: 1, duration: 0.24, ease: "power2.out" }, 5.74);
      const submitState = { t: 0 };
      tl.to(
        submitState,
        {
          t: 7,
          duration: 7,
          ease: "none",
          onUpdate: () => {
            submit.textContent = submitState.t >= 5.92 ? "SENT" : "SEND";
            if (submitState.t >= 5.92) promptCursor.style.opacity = "0";
          },
        },
        0,
      );
      tl.to(prompt, { y: -4, duration: 0.65, ease: "power2.out" }, 6.05);

      const phase = { scale: 1.03 };
      tl.to(phase, { scale: 1.065, duration: 1.45, ease: "power2.out" }, 7.0);
      tl.to(phase, { scale: 0.92, duration: 4.4, ease: "power2.inOut" }, 18.0);

      const drift = { p: 0 };
      tl.to(
        drift,
        {
          p: Math.PI * 4,
          duration: 27,
          ease: "none",
          onUpdate: () => {
            const dx = Math.sin(drift.p) * 4;
            const dy = Math.sin(drift.p * 1.3) * 2;
            camera.style.transform = `scale(${phase.scale}) translate(${dx}px, ${dy}px)`;
          },
        },
        0,
      );

      const providerTimes = [7.45, 10.0, 12.55];
      providerEls.forEach((el, index) => {
        const targetX = Number(el.dataset.targetX);
        const targetY = Number(el.dataset.targetY);
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.76, opacity: 0 },
          {
            x: targetX,
            y: targetY,
            scale: 1,
            opacity: 1,
            duration: 1.35,
            ease: "power3.out",
          },
          providerTimes[index],
        );
        tl.fromTo(
          fills[index],
          { scaleX: 0 },
          {
            scaleX: Number(fills[index].dataset.fill),
            duration: 1.0,
            ease: "power2.out",
          },
          providerTimes[index] + 0.82,

      });

      const stateDriver = { t: 0 };
      tl.to(

        {

          duration: 10,
          ease: "none",
          onUpdate: () => {
            const local = stateDriver.t;
            providerStates[0].textContent =
              local < 1.3 ? "QUERYING" : "VERIFIED";
            providerStates[1].textContent =
              local < 3.8 ? "WAITING" : local < 6.0 ? "QUERYING" : "VERIFIED";
            providerStates[2].textContent =
              local < 6.35 ? "WAITING" : local < 8.6 ? "QUERYING" : "VERIFIED";
          },
        },
        7.0,
      );

      tl.fromTo(
        receiptRail,
        { opacity: 0, x: 24 },
        { opacity: 1, x: 0, duration: 0.8, ease: "power2.out" },
        18.1,
      );
      tl.fromTo(
        passport,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.65, ease: "power2.out" },
        18.65,
      );
      railPaths.forEach((path, index) => {
        tl.to(
          path,
          {
            strokeDashoffset: 0,
            duration: index === 0 ? 0.8 : 0.48,
            ease: "power2.out",
          },
          18.85 + index * 0.38,
        );
      });
      tl.fromTo(
        receipts,
        { opacity: 0, x: 14 },
        { opacity: 1, x: 0, duration: 0.62, ease: "power2.out", stagger: 0.72 },
        19.55,
      );
      tl.fromTo(
        planLockup,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" },
        23.0,
      );
      tl.set(prompt, { visibility: "hidden" }, 23.0);

      tl.pause(0);
      const playbackDriver = { time: 0 };
      const playback = gsap.timeline({ paused: true });
      playback.to(playbackDriver, {
        time: 27,
        duration: 10.261,
        ease: "none",
        onUpdate: () => tl.time(playbackDriver.time, false),
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["03-one-request"] = playback;
    })();
  </script>
