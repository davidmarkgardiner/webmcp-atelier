      [class~="f05-human-boundary-ledger-crop"] img {

        object-fit: cover;
        object-position: 78% 43%;
      }

      [class~="f05-human-boundary-chip-burst"] {
        position: absolute;
        inset: 0;
      }

      [class~="f05-human-boundary-safety-chip"] {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 330px;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        box-sizing: border-box;
        border: 1px solid rgba(23, 35, 60, 0.2);
        border-radius: 9999px;
        background: #fffdf8;
        font-family: "SFMono-Regular";
        font-size: 20px;
        letter-spacing: 0.06em;
        will-change: transform;
      }

      [class~="f05-human-boundary-safety-chip"] svg {
        width: 30px;
        height: 30px;
      }
      [class~="f05-human-boundary-safety-chip"] path {
        fill: none;
        stroke: #245c8f;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>

    <script>
      (() => {
        const frameId = "05-human-boundary";
        const idPrefix = "f05-human-boundary";
        const byId = (suffix) =>
          document.getElementById(`${idPrefix}-${suffix}`);
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines[frameId] = tl;

        const camera = byId("camera");
        const phase = { scale: 0.985 };
        const drift = { p: 0 };

        tl.to(phase, { scale: 1, duration: 1.35, ease: "power2.out" }, 0.45);
        tl.to(
          phase,
          { scale: 1.026, duration: 5.8, ease: "power2.inOut" },
          18.5,
        );
        tl.to(
          drift,
          {
            p: Math.PI * 4,
            duration: 28,
            ease: "none",
            onUpdate: () => {
              const dx = Math.sin(drift.p) * 4;
              const dy = Math.sin(drift.p * 1.31) * 2;
              camera.style.transform = `scale(${phase.scale}) translate(${dx}px, ${dy}px)`;
            },
          },
          0,
        );

        tl.fromTo(
          byId("passport-surface"),
          { opacity: 0.65, y: 18, scale: 0.985 },
          { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
          0,
        );

        const gates = [
          byId("gate-repair"),
          byId("gate-approval"),
          byId("gate-commitment"),
        ];
        const gateTimes = [0.35, 2.75, 5.15];
        gates.forEach((gate, index) => {
          tl.fromTo(
            gate,
            { opacity: 0, y: 28, scale: 0.965 },
            { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" },
            gateTimes[index],
          );
        });

        const drawPath = (path, start, duration = 0.62) => {
          const length = path.getTotalLength();
          path.style.strokeDasharray = `${length}`;
          path.style.strokeDashoffset = `${length}`;
          tl.to(
            path,
            { strokeDashoffset: 0, duration, ease: "power2.out" },
            start,
          );
        };

        drawPath(byId("rail-path"), 0.8, 5.6);
        drawPath(byId("repair-check"), 1.1, 0.62);

        const approvalLayer = byId("approval-layer");
        tl.fromTo(
          approvalLayer,
          { opacity: 0, y: 54 },
          { opacity: 1, y: 0, duration: 1.15, ease: "power3.out" },
          7.5,
        );
        tl.set(
          [
            byId("passport-surface"),
            ...gates,
            camera.querySelector('[class~="f05-human-boundary-kicker"]'),
          ],
          { visibility: "hidden" },
          9.0,
        );

        const statusText = byId("status-text");
        const statusCursor = byId("status-cursor");
        const statusStates = [
          { t: 0, text: "" },
          { t: 0.45, text: "BLOCK" },
          { t: 0.88, text: "BLOCKED" },
          { t: 1.72, text: "BLOCKED · APPROVAL" },
          { t: 2.35, text: "BLOCKED · APPROVAL RECEIPT" },
          { t: 3.05, text: "BLOCKED · APPROVAL RECEIPT REQUIRED" },
        ];
        const textAt = (time) => {
          for (let i = statusStates.length - 1; i >= 0; i -= 1) {
            if (time >= statusStates[i].t) return statusStates[i].text;
          }
          return "";
        };
        const statusDriver = { t: 0 };
        tl.to(
          statusDriver,
          {
            t: 7.4,
            duration: 7.4,
            ease: "none",
            onUpdate: () => {
              statusText.textContent = textAt(statusDriver.t);
            },
          },
          8.15,
        );

        const blink = { p: 0 };
        tl.to(
          blink,
          {
            p: Math.PI * 18,
            duration: 7.4,
            ease: "none",
            onUpdate: () => {
              statusCursor.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
            },
          },
          8.15,
        );

        const receipt = byId("receipt");
        tl.fromTo(
          receipt,
          { scale: 0, opacity: 0, y: 10 },
          { scale: 1, opacity: 1, y: 0, duration: 0.66, ease: "power3.out" },
          15.25,
        );
        drawPath(byId("receipt-check"), 15.66, 0.58);

        const dossierLayer = byId("dossier-layer");
        tl.fromTo(
          dossierLayer,
          { opacity: 0, y: 34 },
          { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" },
          18.5,
        );
        tl.set(approvalLayer, { visibility: "hidden" }, 18.5);
        tl.fromTo(
          byId("dossier-card"),
          { opacity: 0, y: 24, scale: 0.98 },
          { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" },
          18.7,
        );
        tl.fromTo(
          byId("ledger-card"),
          { opacity: 0, y: 24, scale: 0.98 },
          { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" },
          19.45,
        );
        drawPath(byId("dossier-check"), 20.15, 0.64);

        const chipIds = [
          "chip-booking",
          "chip-payment",
          "chip-message",
          "chip-local",
        ];
        const chipTimes = [21.0, 22.4, 23.8, 25.2];
        chipIds.forEach((chipId, index) => {
          const chip = byId(chipId);
          tl.fromTo(
            chip,
            {
              xPercent: -50,
              yPercent: -50,
              x: 0,
              y: 0,
              scale: 0.6,
              opacity: 0,
            },
            {
              xPercent: -50,
              yPercent: -50,
              x: Number(chip.dataset.targetX),
              y: Number(chip.dataset.targetY),
              scale: 1,
              opacity: 1,
              duration: 1.15,
              ease: "power3.out",
            },
            chipTimes[index],
          );
          drawPath(byId(`${chipId}-check`), chipTimes[index] + 0.48, 0.52);
        });
        tl.pause(0);
        const playbackDriver = { time: 0 };
        const playback = gsap.timeline({ paused: true });
        playback.to(playbackDriver, {
          time: 28,
          duration: 13.675,
          ease: "none",
          onUpdate: () => tl.time(playbackDriver.time, false),
        });
        window.__timelines[frameId] = playback;
      })();
    </script>
  </div>
</template>
