  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const compositionId = "01-coordination-problem";
      const composition = document.querySelector(
        '[data-composition-id="01-coordination-problem"]',
      );
      if (!composition || typeof gsap === "undefined") return;

      const byId = (id) => composition.querySelector('[id="' + id + '"]');
      const camera = byId("f01-coordination-problem-camera");
      const browser = composition.querySelector(
        '[data-role="f01-coordination-problem-browser"]',
      );
      const kicker = byId("f01-coordination-problem-kicker");
      const tools = byId("f01-coordination-problem-tools");
      const venue = byId("f01-coordination-problem-provider-venue");
      const food = byId("f01-coordination-problem-provider-food");
      const delivery = byId("f01-coordination-problem-provider-delivery");
      const venueSurface = byId("f01-coordination-problem-surface-venue");
      const foodSurface = byId("f01-coordination-problem-surface-food");
      const title = byId("f01-coordination-problem-contract-title");

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[compositionId] = tl;

      tl.fromTo(
        browser,
        { opacity: 0.9, scale: 0.992 },
        { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" },
        0,
      );
      tl.fromTo(
        kicker,
        { opacity: 0.74, y: 8 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" },
        0.05,
      );

      const cameraPhase = { scale: 0.985, focusX: 0, focusY: 0 };
      tl.to(
        cameraPhase,
        {
          scale: 1.01,
          focusX: -12,
          focusY: 6,
          duration: 4.1,
          ease: "power2.inOut",
        },
        0.2,
      );
      tl.to(
        cameraPhase,
        {
          scale: 1.045,
          focusX: -18,
          focusY: -4,
          duration: 6.2,
          ease: "power2.inOut",
        },
        11.5,
      );

      const cameraDrift = { p: 0 };
      tl.to(
        cameraDrift,
        {
          p: Math.PI * 3,
          duration: 18,
          ease: "none",
          onUpdate: () => {
            const dx = Math.sin(cameraDrift.p) * 3.2;
            const dy = Math.sin(cameraDrift.p * 1.31) * 1.8;
            camera.style.transform = `scale(${cameraPhase.scale}) translate(${cameraPhase.focusX + dx}px, ${cameraPhase.focusY + dy}px)`;
          },
        },
        0,
      );

      tl.fromTo(
        venue,
        {
          xPercent: -50,
          yPercent: -50,
          x: -1040,
          y: -20,
          rotateY: 24,
          opacity: 0,
        },
        {
          x: -420,
          y: -20,
          rotateY: 14,
          opacity: 1,
          duration: 1.05,
          ease: "power3.out",
        },
        4.5,
      );
      tl.fromTo(
        food,
        {
          xPercent: -50,
          yPercent: -50,
          x: 1040,
          y: -20,
          rotateY: -24,
          opacity: 0,
        },
        {
          x: 420,
          y: -20,
          rotateY: -14,
          opacity: 1,
          duration: 1.05,
          ease: "power3.out",
        },
        4.72,
      );
      tl.fromTo(
        delivery,
        { xPercent: -50, yPercent: -50, x: 0, y: 200, scale: 0, opacity: 0 },
        {
          x: 0,
          y: 200,
          scale: 1,
          opacity: 1,
          duration: 0.62,
          ease: "power3.out",
        },
        8.15,
      );

      const idle = { p: 0 };
      tl.to(
        idle,
        {
          p: Math.PI * 4,
          duration: 5.25,
          ease: "none",
          onUpdate: () => {
            const progress = idle.p / (Math.PI * 4);
            const envelope = progress < 0.78 ? 1 : (1 - progress) / 0.22;
            const offset = Math.sin(idle.p) * 2.2 * Math.max(0, envelope);
            venueSurface.style.transform = `translateY(${offset}px)`;
            foodSurface.style.transform = `translateY(${-offset}px)`;
          },
        },
        6.05,
      );

      tl.fromTo(
        tools,
        { opacity: 0, scale: 0.985 },
        { opacity: 0.28, scale: 1, duration: 1.1, ease: "power2.out" },
        11.5,
      );

      const finalOffsets = [-150, 40, 230];
      [venue, food, delivery].forEach((provider, index) => {
        tl.to(
          provider,
          {
            x: 0,
            y: finalOffsets[index],
            rotateY: 0,
            scale: 1,
            duration: 0.45,
            ease: "power2.inOut",
          },
          11.5,
        );
      });

      [venue, food, delivery].forEach((provider, index) => {
        tl.to(
          provider,
          {
            x: 0,
            y: finalOffsets[index],
            rotateY: 0,
            scale: 1,
            opacity: 1,
            duration: 1.35,
            ease: "power3.out",
          },
          11.98 + index * 0.06,
        );
      });

      const titleStates = [
        { t: 0, text: "" },
        { t: 0.35, text: "STRUCTURED" },
        { t: 1.15, text: "STRUCTURED ..." },
        { t: 1.75, text: "STRUCTURED CONTRACTS" },
      ];
      const titleAt = (time) => {
        for (let i = titleStates.length - 1; i >= 0; i -= 1) {
          if (time >= titleStates[i].t) return titleStates[i].text;
        }
        return "";
      };
      const titleDriver = { t: 0 };
      tl.to(
        titleDriver,
        {
          t: 2.2,
          duration: 2.2,
          ease: "none",
          onUpdate: () => {
            title.textContent = titleAt(titleDriver.t);
          },
        },
        11.5,
      );

      tl.pause(0);
      const playbackDriver = { time: 0 };
      const playback = gsap.timeline({ paused: true });
      playback.to(playbackDriver, {
        time: 18,
        duration: 14.165,
        ease: "none",
        onUpdate: () => tl.time(playbackDriver.time, false),
      });
      window.__timelines[compositionId] = playback;
    })();
  </script>
